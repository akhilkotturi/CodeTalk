services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_service
      POSTGRES_USER: war_room
      POSTGRES_PASSWORD: war_room
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U war_room -d incident_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  incident-service:
    build:
      context: ..
      dockerfile: services/incident-service/Dockerfile
    environment:
      DATABASE_URL: postgres://war_room:war_room@postgres:5432/incident_service
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-internal-dev-token}
      RABBITMQ_URL: amqp://rabbitmq:5672
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  snippet-service:
    build:
      context: ..
      dockerfile: services/snippet-service/Dockerfile
    environment:
      DATABASE_URL: postgres://war_room:war_room@postgres:5432/incident_service
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      PORT: "4001"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  ws-gateway:
    build:
      context: ..
      dockerfile: services/ws-gateway/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-internal-dev-token}
      INCIDENT_SERVICE_URL: http://incident-service:4000
      PORT: "4002"
    ports:
      - "4002:4002"
    depends_on:
      - incident-service

  kong:
    image: kong:3.7.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../gateway/kong:/kong/declarative
    depends_on:
      - incident-service
      - snippet-service
      - ws-gateway
      - notification-service

  # ── Phase 7: RabbitMQ (membership events / notification-service) ──────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      PORT: "4003"
    ports:
      - "4003:4003"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ── Phase 8: Redis (presence state, active-incident caching) ─────────────
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redisdata:/data

volumes:
  pgdata:
  rabbitmqdata:
  # redisdata:    # Phase 8
