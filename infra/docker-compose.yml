services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_service
      POSTGRES_USER: war_room
      POSTGRES_PASSWORD: war_room
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U war_room -d incident_service"]
      interval: 5s
      timeout: 5s
      retries: 5

