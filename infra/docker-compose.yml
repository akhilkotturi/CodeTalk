services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_service
      POSTGRES_USER: war_room
      POSTGRES_PASSWORD: war_room
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U war_room -d incident_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  incident-service:
    build:
      context: ..
      dockerfile: services/incident-service/Dockerfile
    environment:
      DATABASE_URL: postgres://war_room:war_room@postgres:5432/incident_service
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-internal-dev-token}
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  snippet-service:
    build:
      context: ..
      dockerfile: services/snippet-service/Dockerfile
    environment:
      DATABASE_URL: postgres://war_room:war_room@postgres:5432/incident_service
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      PORT: "4001"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  ws-gateway:
    build:
      context: ..
      dockerfile: services/ws-gateway/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-internal-dev-token}
      INCIDENT_SERVICE_URL: http://incident-service:4000
      PORT: "4002"
    ports:
      - "4002:4002"
    depends_on:
      - incident-service

  kong:
    image: kong:3.7.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../gateway/kong:/kong/declarative
    depends_on:
      - incident-service
      - snippet-service
      - ws-gateway

  # ── Phase 7: RabbitMQ (membership events / notification-service) ──────────
